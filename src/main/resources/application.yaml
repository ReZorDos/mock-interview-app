server:
  port: 8081
  error:
    whitelabel:
      enabled: false
spring:
  application:
    name: MockInterview
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/database-changelog-master.yaml
    enabled: true
    drop-first: false
yandex:
  oauth:
    client-id: ${YANDEX_CLIENT_ID:711e9da07b3b4a82bf8ef2ad6482ec05}
    client-secret: ${YANDEX_CLIENT_SECRET:b6512f1875074a11b874397b1a7f4322}
    redirect-uri: ${YANDEX_REDIRECT_URI:http://localhost:8081/oauth/yandex/callback}

assemblyai:
  api-key: ${ASSEMBLYAI_API_KEY:4e95859b4c4447cf8e95e98bbbaa8f2d}
  base-url: ${ASSEMBLYAI_BASE_URL:https://api.assemblyai.com}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:audio-files}