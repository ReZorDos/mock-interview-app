<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/default :: layout(title='Скрининги', activeLink='screenings', content=~{:: content}, scripts=null)}">
<body>
<th:block th:fragment="content">
  <main class="site-main">
    <div class="page-wrap page-wrap--medium">

        <div class="page-header">
            <div>
                <h1 class="page-title">Скрининги</h1>
                <p class="page-subtitle">Выберите компанию для просмотра откликов</p>
            </div>
            <a href="/home" class="btn btn-outline-secondary btn-sm">На главную</a>
        </div>

        <div th:if="${companies.isEmpty()}" class="empty-state">
            <div class="empty-state__icon">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </div>
            <h3 class="empty-state__title">Компаний пока нет</h3>
            <p class="empty-state__text">Создайте компанию и добавьте вакансии, чтобы получать отклики</p>
            <a href="/company" class="btn btn-primary mt-2">Управление компаниями</a>
        </div>

        <div th:unless="${companies.isEmpty()}" class="company-grid">
            <a th:each="c : ${companies.content}"
               th:href="@{/interviewer/screenings/company/{id}(id=${c.id})}"
               class="company-card">
                <div class="company-card__icon">
                    <img th:if="${c.logoUrl != null and !#strings.isEmpty(c.logoUrl)}"
                         th:src="${c.logoUrl}" th:alt="${c.name}" loading="lazy">
                    <svg th:unless="${c.logoUrl != null and !#strings.isEmpty(c.logoUrl)}"
                         viewBox="0 0 24 24">
                        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </div>
                <span class="company-card__name" th:text="${c.name}"></span>
                <p th:if="${c.description != null and !#strings.isEmpty(c.description)}"
                   class="company-card__desc"
                   th:text="${#strings.length(c.description) > 100 ? #strings.substring(c.description, 0, 100) + '…' : c.description}"></p>
                <div class="company-card__footer">
                    <span class="company-card__vacancies">
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <path d="M3 9h18M9 21V9"/>
                        </svg>
                        <span th:text="${#lists.size(c.vacancyList)} + ' вак.'"></span>
                    </span>
                </div>
            </a>
        </div>

        <div th:if="${totalPages > 1}" class="pagination-bar">
            <a th:if="${currentPage > 1}"
               th:href="@{/interviewer/screenings(page=${currentPage - 2})}"
               class="pagination-bar__page">←</a>
            <div class="pagination-bar__pages">
                <th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
                    <a th:if="${i >= currentPage - 2 and i <= currentPage + 2}"
                       th:href="@{/interviewer/screenings(page=${i - 1})}"
                       th:text="${i}"
                       th:class="${'pagination-bar__page' + (i == currentPage ? ' pagination-bar__page--active' : '')}"></a>
                </th:block>
            </div>
            <a th:if="${currentPage < totalPages}"
               th:href="@{/interviewer/screenings(page=${currentPage})}"
               class="pagination-bar__page">→</a>
        </div>

    </div>
  </main>
</th:block>
</body>
</html>
