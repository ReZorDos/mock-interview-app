<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Ошибка ' + ${status} + ' — MockInterview'">Ошибка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            text-align: center;
            background: var(--bg, #f8f9fa);
        }
        .error-page__code {
            font-family: var(--font-display, 'DM Serif Display', serif);
            font-size: clamp(5rem, 15vw, 9rem);
            font-weight: 400;
            line-height: 1;
            color: var(--ink, #0a0a0a);
            margin-bottom: .5rem;
            opacity: .12;
            user-select: none;
        }
        .error-page__title {
            font-family: var(--font-display, 'DM Serif Display', serif);
            font-size: 1.75rem;
            font-weight: 400;
            color: var(--ink, #0a0a0a);
            margin-bottom: .75rem;
        }
        .error-page__message {
            font-size: .9375rem;
            color: var(--ink-400, #6b7280);
            max-width: 480px;
            line-height: 1.65;
            margin-bottom: 2rem;
        }
        .error-page__actions {
            display: flex;
            gap: .75rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .error-brand {
            position: fixed;
            top: 1.25rem;
            left: 1.5rem;
            display: flex;
            align-items: center;
            gap: .5rem;
            font-weight: 600;
            font-size: .9375rem;
            color: var(--ink, #0a0a0a);
            text-decoration: none;
        }
        .error-brand svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.75;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

<a href="/home" class="error-brand">
    <svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>
    MockInterview
</a>

<div class="error-page">
    <div class="error-page__code" th:text="${status}">500</div>
    <h1 class="error-page__title" th:text="${title ?: error ?: 'Что-то пошло не так'}">Ошибка</h1>
    <p class="error-page__message"
       th:text="${message != null and !#strings.isEmpty(message)} ? ${message} : 'Произошла непредвиденная ошибка. Попробуйте вернуться назад или на главную страницу.'">
        Произошла непредвиденная ошибка.
    </p>
    <div class="error-page__actions">
        <a href="javascript:history.back()" class="btn btn-outline-secondary">← Назад</a>
        <a href="/home" class="btn btn-primary">На главную</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
