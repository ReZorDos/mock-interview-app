<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/screening :: layout(title='Скрининг завершён', content=~{:: content}, scripts=null)}">
<body>
<th:block th:fragment="content">
  <main class="site-main" style="display:flex;align-items:center;justify-content:center;padding:3rem 1rem;">
    <div style="width:100%;max-width:460px;">
        <div class="card text-center" style="border-top:3px solid var(--emerald) !important;padding:.5rem;">
            <div class="card-body" style="padding:3rem 2rem;">
                <div class="complete-icon">
                    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                </div>
                <h1 style="font-family:var(--font-display);font-size:1.625rem;font-weight:400;margin-bottom:.75rem;color:var(--ink);">
                    Скрининг завершён!
                </h1>
                <p class="text-muted mb-4" style="font-size:.9375rem;line-height:1.65;">
                    Все ваши ответы записаны и отправлены на проверку. Ожидайте обратной связи от интервьюера.
                </p>
                <div class="d-flex gap-2 justify-content-center flex-wrap">
                    <a href="/vacancy" class="btn btn-primary">К списку вакансий</a>
                    <a href="/feedback/my" class="btn btn-outline-secondary">Мои отклики</a>
                </div>
            </div>
        </div>
    </div>
  </main>
</th:block>
</body>
</html>
