<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/default :: layout(title=${company.name}, activeLink='companies', content=~{:: content}, scripts=null)}">
<body>
<th:block th:fragment="content">
  <main class="site-main">
    <div class="page-wrap page-wrap--medium">

        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/company/browse">Компании</a></li>
                <li class="breadcrumb-item active" th:text="${company.name}"></li>
            </ol>
        </nav>

        <div class="company-header mb-4">
            <div class="company-header__logo" th:if="${company.logoUrl != null and !#strings.isEmpty(company.logoUrl)}">
                <img th:src="${company.logoUrl}" th:alt="${company.name}" loading="lazy">
            </div>
            <div class="company-header__logo company-header__logo--placeholder"
                 th:unless="${company.logoUrl != null and !#strings.isEmpty(company.logoUrl)}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
            </div>
            <div>
                <h1 class="page-title mb-1" th:text="${company.name}"></h1>
                <p th:if="${company.description != null and !#strings.isEmpty(company.description)}"
                   class="page-subtitle" th:text="${company.description}"></p>
            </div>
        </div>

        <div class="page-header" style="margin-bottom:1.25rem;">
            <div>
                <h2 style="font-family:var(--font-display);font-size:1.25rem;font-weight:400;color:var(--ink);margin:0;">
                    Вакансии
                </h2>
                <p class="page-subtitle"
                   th:text="${vacancies.isEmpty()} ? 'Активных вакансий нет' : 'Всего: ' + ${vacancies.size()}"></p>
            </div>
            <a href="/company/browse" class="btn btn-outline-secondary btn-sm">← Все компании</a>
        </div>

        <div th:if="${vacancies.isEmpty()}" class="empty-state">
            <div class="empty-state__icon">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
            </div>
            <h3 class="empty-state__title">Вакансий пока нет</h3>
            <p class="empty-state__text">У этой компании ещё нет опубликованных позиций</p>
        </div>

        <div th:unless="${vacancies.isEmpty()}" class="vacancy-list">
            <div th:each="v : ${vacancies}" class="vcard">
                <div class="vcard__top">
                    <div>
                        <a th:href="@{/vacancy/{id}(id=${v.id})}" th:text="${v.title}" class="vcard__title"></a>
                        <div class="vcard__meta">
                            <span th:text="${v.vacancyLevel}"
                                  th:class="${'badge ' + (v.vacancyLevel == 'JUNIOR' ? 'bg-success' : (v.vacancyLevel == 'MIDDLE' ? 'bg-warning' : 'bg-danger'))}"></span>
                        </div>
                    </div>
                    <span th:if="${v.salaryFrom != null or v.salaryTo != null}" class="vcard__salary">
                        <th:block th:if="${v.salaryFrom != null and v.salaryTo != null}"
                                  th:text="${#numbers.formatInteger(v.salaryFrom,0,'WHITESPACE') + ' – ' + #numbers.formatInteger(v.salaryTo,0,'WHITESPACE') + ' ₽'}"></th:block>
                        <th:block th:if="${v.salaryFrom != null and v.salaryTo == null}"
                                  th:text="${'от ' + #numbers.formatInteger(v.salaryFrom,0,'WHITESPACE') + ' ₽'}"></th:block>
                        <th:block th:if="${v.salaryFrom == null and v.salaryTo != null}"
                                  th:text="${'до ' + #numbers.formatInteger(v.salaryTo,0,'WHITESPACE') + ' ₽'}"></th:block>
                    </span>
                </div>

                <p th:if="${v.description != null and !#strings.isEmpty(v.description)}"
                   class="vcard__desc"
                   th:text="${#strings.length(v.description) > 160 ? #strings.substring(v.description, 0, 160) + '...' : v.description}"></p>
                <p th:unless="${v.description != null and !#strings.isEmpty(v.description)}"
                   class="vcard__desc vcard__desc--empty">Описание не указано</p>

                <div class="vcard__tags">
                    <span th:if="${v.city != null and !#strings.isEmpty(v.city)}" class="vcard__tag">
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
                        <span th:text="${v.city}"></span>
                    </span>
                    <span th:if="${v.schedule != null}" class="vcard__tag">
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        <span th:text="${v.schedule.displayName}"></span>
                    </span>
                </div>

                <div th:if="${v.skills != null and !v.skills.isEmpty()}" class="vcard__skills">
                    <span th:each="skill : ${v.skills}" class="badge bg-secondary" th:text="${skill.name}"></span>
                </div>

                <div class="vcard__bottom">
                    <span class="vcard__date" th:text="${'Опубликовано ' + #temporals.format(v.createdAt, 'dd.MM.yyyy')}"></span>
                    <a th:href="@{/vacancy/{id}(id=${v.id})}" class="btn btn-sm btn-outline-primary">Подробнее →</a>
                </div>
            </div>
        </div>

    </div>
  </main>
</th:block>
</body>
</html>
