<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/default :: layout(title=${companyRequest.id != null ? 'Редактировать компанию' : 'Создать компанию'}, activeLink='companies-manage', content=~{:: content}, scripts=null)}">
<body>
<th:block th:fragment="content">
  <main class="site-main">
    <div class="page-wrap page-wrap--narrow">

        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/company">Компании</a></li>
                <li class="breadcrumb-item active"
                    th:text="${companyRequest.id != null ? 'Редактировать' : 'Создать компанию'}"></li>
            </ol>
        </nav>

        <h1 class="page-title mb-4"
            th:text="${companyRequest.id != null ? 'Редактировать компанию' : 'Создать компанию'}"></h1>

        <div class="card">
            <div class="card-body" style="padding:2rem;">
                <form th:action="${companyRequest.id != null} ? '/company/' + ${companyRequest.id} + '/edit' : '/company/create'"
                      th:object="${companyRequest}" method="post">

                    <div class="mb-3">
                        <label for="name" class="form-label">Название <span style="color:var(--copper)">*</span></label>
                        <input type="text" id="name" th:field="*{name}"
                               th:class="${#fields.hasErrors('name')} ? 'form-control is-invalid' : 'form-control'"
                               placeholder="Например: Google">
                        <div th:if="${#fields.hasErrors('name')}" class="invalid-feedback">
                            <span th:errors="*{name}"></span>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Описание</label>
                        <textarea id="description" th:field="*{description}" rows="3"
                                  th:class="${#fields.hasErrors('description')} ? 'form-control is-invalid' : 'form-control'"
                                  placeholder="Краткое описание компании..."></textarea>
                        <div th:if="${#fields.hasErrors('description')}" class="invalid-feedback">
                            <span th:errors="*{description}"></span>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="logoUrl" class="form-label">URL логотипа</label>
                        <input type="text" id="logoUrl" th:field="*{logoUrl}"
                               th:class="${#fields.hasErrors('logoUrl')} ? 'form-control is-invalid' : 'form-control'"
                               placeholder="https://example.com/logo.png">
                        <div th:if="${#fields.hasErrors('logoUrl')}" class="invalid-feedback">
                            <span th:errors="*{logoUrl}"></span>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                        <a href="/company" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>

    </div>
  </main>
</th:block>
</body>
</html>
