<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/default :: layout(title='Мои компании', activeLink='companies-manage', content=~{:: content}, scripts=null)}">
<body>
<th:block th:fragment="content">
  <main class="site-main">
    <div class="page-wrap">
        <div class="page-header">
            <div>
                <h1 class="page-title">Мои компании</h1>
                <p class="page-subtitle">Управление вашими компаниями</p>
            </div>
            <a href="/company/create" class="btn btn-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Добавить компанию
            </a>
        </div>

        <div th:if="${companies.isEmpty()}" class="empty-state">
            <div class="empty-state__icon">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </div>
            <h3 class="empty-state__title">Компаний пока нет</h3>
            <p class="empty-state__text">Создайте первую компанию для публикации вакансий</p>
        </div>

        <style>
            .company-card {
                background: #fff;
                border: 1.5px solid var(--border);
                border-radius: var(--r-lg);
                transition: box-shadow var(--t), transform var(--t), border-color var(--t);
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }
            .company-card:hover {
                box-shadow: var(--shadow-md);
                border-color: var(--border-hover);
                transform: translateY(-2px);
            }
            .company-card__body { padding: 1.5rem; flex: 1; }
            .company-card__logo {
                width: 48px; height: 48px;
                border-radius: 10px;
                background: var(--grad-brand);
                display: flex; align-items: center; justify-content: center;
                font-family: var(--font-display);
                font-size: 1.25rem;
                color: #fff;
                margin-bottom: 1rem;
                flex-shrink: 0;
            }
            .company-card__footer {
                border-top: 1px solid var(--border);
                padding: .875rem 1.5rem;
                display: flex;
                gap: .5rem;
                background: var(--ivory-dim);
            }
        </style>

        <div th:unless="${companies.isEmpty()}" class="row g-3">
            <div class="col-md-6 col-lg-4" th:each="company : ${companies}">
                <div class="company-card">
                    <div class="company-card__body">
                        <div class="company-card__logo"
                             th:text="${#strings.toUpperCase(#strings.substring(company.name, 0, 1))}">К</div>
                        <h3 class="card-title" style="font-size:1rem;margin-bottom:.375rem;"
                            th:text="${company.name}"></h3>
                        <p class="text-muted mb-0" style="font-size:.875rem;line-height:1.55;"
                           th:text="${company.description != null ? company.description : 'Описание не добавлено'}"></p>
                    </div>
                    <div class="company-card__footer">
                        <a th:href="@{/company/{id}/edit(id=${company.id})}"
                           class="btn btn-sm btn-outline-secondary">Редактировать</a>
                        <form th:action="@{/company/{id}/delete(id=${company.id})}"
                              method="post"
                              onsubmit="return confirm('Удалить компанию?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
  </main>
</th:block>
</body>
</html>
